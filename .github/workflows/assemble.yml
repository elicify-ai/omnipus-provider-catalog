# Daily assembly + release of providers_catalog.json for Omnipus (ADR-067 D1).
#
# Pipeline (spec: docs/internal/specs/adr-067-registry-catalog-spec.md, US-2;
# ADR-067 §2 and §8b hold the publication rules):
#   1–6  fetch → merge → adjudicate → overrides → carry forward → validate
#        = `npm run assemble` (src/assemble.ts) + `npm run validate` +
#          `npm run validate:spec` (independent spec validator).
#   7    publish: GitHub Release tagged vYYYY.M.D[.N] carrying exactly
#        providers_catalog.json + providers_catalog.json.sha256 (FR-007, FR-032,
#        US-2.AC1; checksum only, no signature — ADR-067 §6 item 7), then the
#        same two files committed to main as the raw-URL fallback (FR-032).
#        Skipped when the document is byte-identical to the latest release.
#   4'   disputes above the tolerance open ONE issue per run and never fail
#        the run (US-2.AC2, ADR-067 §8a MAJ-014).
#   8    snapshot PR against elicify-ai/omnipus — still manual (FR-006, A-15).
#
# Versioning: src/version.ts derives vYYYY.M.D from the run date and appends
# .N when `--previous` (the root providers_catalog.json, i.e. the last release)
# already carries today's date. The validator rejects any version that is not
# strictly greater than the previous one, so the puller never downgrades.
name: assemble

on:
  schedule:
    - cron: "0 6 * * *"   # daily, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write   # create the release; push the raw-fallback copy to main
  issues: write     # open the disagreement issue

concurrency:
  group: assemble
  cancel-in-progress: false

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # version.ts / overrides commit id in the manifest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The root providers_catalog.json is the last release (committed in the
      # "raw fallback" step below); the CLI picks it up as --previous when present.
      - name: assemble (fetch → merge → adjudicate → overrides → carry forward → validate)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # commits API only (upstream commit ids in the manifest)
        run: npm run assemble

      - name: validate (consumer rules)
        run: |
          if [ -f providers_catalog.json ]; then
            npm run validate -- dist/providers_catalog.json --previous providers_catalog.json
          else
            npm run validate -- dist/providers_catalog.json
          fi

      - name: validate (independent spec validator)
        run: npm run validate:spec -- dist/providers_catalog.json

      - uses: actions/upload-artifact@v4
        with:
          name: providers_catalog
          path: |
            dist/providers_catalog.json
            dist/providers_catalog.json.sha256
            dist/manifest.json

      - name: decide whether to release
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(node -p 'require("./dist/manifest.json").version')"
          sha="$(cut -d' ' -f1 dist/providers_catalog.json.sha256)"
          disputes="$(node -p 'Number(require("./dist/manifest.json").counts.disputes_open || 0)')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "disputes=$disputes" >> "$GITHUB_OUTPUT"
          latest="$(gh release list --limit 1 --json tagName -q '.[0].tagName' || true)"
          latest_sha=""
          if [ -n "$latest" ]; then
            tmp="$(mktemp -d)"
            if gh release download "$latest" --pattern providers_catalog.json.sha256 --dir "$tmp" 2>/dev/null; then
              latest_sha="$(cut -d' ' -f1 "$tmp/providers_catalog.json.sha256")"
            fi
          fi
          if [ -n "$latest_sha" ] && [ "$latest_sha" = "$sha" ]; then
            echo "document is byte-identical to $latest ($sha); skipping release"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "new document $version ($sha); latest was ${latest:-none} (${latest_sha:-n/a})"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: publish release (step 7)
        if: steps.decide.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.decide.outputs.version }}
          SHA: ${{ steps.decide.outputs.sha }}
          DISPUTES: ${{ steps.decide.outputs.disputes }}
        run: |
          set -euo pipefail
          md="$(node -p 'require("./dist/manifest.json").sources.models_dev.commit')"
          ll="$(node -p 'require("./dist/manifest.json").sources.litellm.commit')"
          providers="$(node -p 'require("./dist/manifest.json").counts.providers')"
          models="$(node -p 'require("./dist/manifest.json").counts.models')"
          gh release create "$VERSION" \
            dist/providers_catalog.json dist/providers_catalog.json.sha256 \
            --title "$VERSION" \
            --notes "Assembled catalog (models.dev \`$md\` + LiteLLM \`$ll\` + overrides); $providers providers, $models models, $DISPUTES disputed row(s). Checksum-only per ADR-067: sha256 $SHA."

      - name: commit raw-fallback copy to main (FR-032)
        if: steps.decide.outputs.release == 'true'
        env:
          VERSION: ${{ steps.decide.outputs.version }}
        run: |
          set -euo pipefail
          cp dist/providers_catalog.json dist/providers_catalog.json.sha256 .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add providers_catalog.json providers_catalog.json.sha256
          git commit -m "chore(release): raw-fallback copy of $VERSION"
          git push origin HEAD:main

      - name: open disagreement issue (never fails the run)
        if: steps.decide.outputs.release == 'true' && steps.decide.outputs.disputes != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.decide.outputs.version }}
          DISPUTES: ${{ steps.decide.outputs.disputes }}
        run: |
          node scripts/dispute-issue-body.mjs dist/manifest.json > /tmp/issue-body.md
          gh label create registry-dispute --description "models.dev / LiteLLM disagreement above tolerance" --color D93F0B 2>/dev/null || true
          gh issue create \
            --title "Registry disagreements in $VERSION ($DISPUTES row(s))" \
            --label registry-dispute \
            --body-file /tmp/issue-body.md || echo "::warning::could not open the dispute issue"
